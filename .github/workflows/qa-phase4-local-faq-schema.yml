name: Phase 4.5 Local FAQ Schema QA

on:
  push:
    branches:
      - test/seo-phase4-local-faq-parity
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Phase 4.5 focused regression
        run: node --test tests/phase4-local-faq-schema-parity.test.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-file ESLint
        run: npx eslint tests/phase4-local-faq-schema-parity.test.mjs

      - name: Production build
        run: npm run build
