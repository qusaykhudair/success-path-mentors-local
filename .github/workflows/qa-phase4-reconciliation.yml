name: Phase 4 Reconciliation QA

on:
  push:
    branches:
      - fix/seo-phase4-reconcile-post-phase3

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused Phase 4 reconciliation tests
        run: node --test tests/phase4-post-phase3-reconciliation.test.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint changed TypeScript page
        run: npx eslint 'src/app/[locale]/(catalog)/subjects/french/page.tsx'

      - name: Production build
        run: npm run build
