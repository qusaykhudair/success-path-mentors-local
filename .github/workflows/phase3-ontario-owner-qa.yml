name: Phase 3 Ontario Owner QA

on:
  push:
    branches:
      - fix/seo-phase3-ontario-owner-consolidation

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Changed-file ESLint
        run: >-
          npx eslint
          "src/config/routes.ts"
          "src/app/[locale]/(catalog)/locations/[...segments]/page.tsx"
          "src/app/[locale]/(marketing)/curriculum/ontario/page.tsx"
          "src/app/sitemap.ts"
          "tests/ontario-curriculum-owner.test.mjs"

      - name: Ontario owner regression tests
        run: node --test tests/ontario-curriculum-owner.test.mjs

      - name: Production build
        run: npm run build
