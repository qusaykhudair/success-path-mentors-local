name: Phase 6.8 QA

on:
  push:
    branches:
      - seo/phase-6-8-internal-link-distribution

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Focused Phase 6.8 regression
        run: node --test tests/phase6-internal-authority-distribution.test.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Changed-file ESLint
        run: >-
          bash scripts/sites-env.sh -- npx eslint
          src/components/internal/authority-distribution-links.tsx
          'src/app/[locale]/(catalog)/subjects/math/page.tsx'
          'src/app/[locale]/(catalog)/subjects/english/page.tsx'
          'src/app/[locale]/(catalog)/subjects/general-science/page.tsx'
          'src/app/[locale]/(catalog)/subjects/chemistry/page.tsx'
          'src/app/[locale]/(catalog)/subjects/physics/page.tsx'
          'src/app/[locale]/(catalog)/subjects/french/page.tsx'

      - name: Production build
        run: bash scripts/sites-env.sh -- npm run build
