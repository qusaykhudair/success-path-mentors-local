name: QA Ontario production redirect

on:
  push:
    branches:
      - fix/seo-ontario-production-redirect

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Changed-file ESLint
        run: npx eslint src/proxy.ts tests/ontario-curriculum-owner.test.mjs

      - name: Ontario regression test
        run: node --test tests/ontario-curriculum-owner.test.mjs

      - name: Production build
        run: npm run build
