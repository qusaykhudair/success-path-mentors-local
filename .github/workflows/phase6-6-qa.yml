name: Phase 6.6 QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 6.6 focused regression
        run: node --test tests/phase6-eeat-trust-layer.test.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Changed-file ESLint
        run: npx eslint 'src/app/[locale]/(marketing)/about/page.tsx' src/config/legal.ts src/content/pages/trust-transparency.ts

      - name: Production build
        run: npm run build
